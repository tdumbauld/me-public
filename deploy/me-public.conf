# tools.morningexecution.com -> uvicorn on 127.0.0.1:8001
#
# This is the PRE-CERTIFICATE state. certbot rewrites this file when it issues
# the certificate: it adds the 443 server block, the cert paths and the :80
# redirect. After that runs, the installed file is the record, not this one.
#
# THERE IS NO auth_basic HERE, AND THAT IS THE DIFFERENCE FROM me-app.conf.
# The terminal has no application-level auth of its own, so nginx is the only
# gate in front of a journal of real positions. This site is the opposite: it
# is meant to be public, and every route that must not be is gated in the
# application by `Depends(require(<level>))` against beehiiv. Putting a basic
# auth prompt here would lock out the subscribers the site exists to serve.
#
# WHAT MUST STAY REACHABLE WITHOUT A SESSION, or the sign-in flow cannot
# complete: `/` (the box, and where /api/access/verify redirects an unknown
# tool slug), `/api/access/*` (identify, verify, me, signout, refresh) and
# `/api/health`. None of them is gated in the app either. The gate is on
# /tools/* and nowhere else.

server {
    server_name tools.morningexecution.com;

    # Let certbot answer the ACME challenge, or issuance fails in a way that
    # reads like a DNS problem.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # A magic link is one GET with a single-use token in the query string. It
    # is rate limited because the token is the credential: without this, the
    # verify endpoint is an open guessing surface. The zone is declared in
    # deploy/me-public-limits.conf, which must be installed into conf.d/
    # because limit_req_zone is only valid at http{} level.
    location = /api/access/verify {
        limit_req zone=me_public_verify burst=10 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # identify() reaches beehiiv on a miss, so it is the one route a stranger
    # can use to make this box call the vendor. Rate limited for that reason
    # rather than for abuse of the site itself.
    location ^~ /api/access/ {
        limit_req zone=me_public_identify burst=20 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # proxy_set_header is repeated rather than inherited: a location
        # inherits from server{} and http{}, never from a sibling location.

        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    client_max_body_size 1m;

    listen 80;
    listen [::]:80;
}
