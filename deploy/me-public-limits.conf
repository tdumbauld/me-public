# limit_req_zone is only valid at http{} level, so it cannot live in the vhost
# that uses it. Installed to /etc/nginx/conf.d/me-public-limits.conf.
#
# Two zones, because the two routes are abused differently. verify() burns a
# single-use token and is the one place a guessed credential would be tried;
# identify() reaches beehiiv on a cache miss, so a loop against it spends the
# vendor's rate limit rather than this box's CPU. 10m of state holds roughly
# 160k addresses, which is far more than this publication will ever see.
limit_req_zone $binary_remote_addr zone=me_public_verify:10m   rate=10r/m;
limit_req_zone $binary_remote_addr zone=me_public_identify:10m rate=20r/m;
